<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Swan Poá Archive</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <p class="marca">SWAN POÁ</p>
    <h1>An Object of Beauty</h1>
  </header>

  <main>
    <section class="pesquisa">
      <input id="busca" type="search"
        placeholder="Procure sua maquiagem favorita...">

      <select id="categoria">
        <option value="">Todas as categorias</option>
        <option value="lipstick">Batons</option>
        <option value="blush">Blushes</option>
        <option value="mascara">Máscaras de cílios</option>
        <option value="eyeshadow">Sombras</option>
        <option value="nail_polish">Esmaltes</option>
      </select>

      <button id="pesquisar">Pesquisar</button>
    </section>

    <p id="mensagem">Carregando...</p>
    <section id="produtos" class="produtos"></section>

    <section class="painel-logs">
      <button id="ver-logs" type="button">Ver logs de utilização</button>
      <div id="area-logs" hidden>
        <div class="cabecalho-logs">
          <h2>Registros de utilização</h2>
          <button id="atualizar-logs" type="button" class="secundario">Atualizar</button>
        </div>
        <p id="mensagem-logs" aria-live="polite">Clique em “Ver logs de utilização” para consultar os registros.</p>
        <div id="lista-logs" class="lista-logs"></div>
      </div>
    </section>
  </main>

  <footer>
    <p>Desenvolvido por Maria Luiza Simon</p>
    <p>Fundamentos ao Desenvolvimento Web, Sistemas de Informação</p>
  </footer>
</body>
</html>
